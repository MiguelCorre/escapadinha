tips:
  - title: Sê flexível nas datas
    body: Voar a meio da semana costuma sair mais barato do que à sexta ou ao domingo. Compara vários dias antes de reservar.
  - title: Compara Lisboa, Porto e Faro
    body: O mesmo destino pode custar bem menos a partir de outro aeroporto. Soma o custo da viagem até lá antes de decidir.
  - title: Leva só bagagem de mão
    body: Nas low-cost, a mala de porão pode custar mais do que o próprio voo. Confirma as medidas permitidas pela companhia.
  - title: Ativa as notificações
    body: Os preços mudam várias vezes por dia. Segue a conta e ativa as notificações para veres as promoções primeiro.
  - title: Confirma o preço final
    body: Bagagem, lugar e método de pagamento podem mudar o total. Revê o preço final antes de pagar.
