# Férias escolares de Portugal, ano letivo 2026/2027, por rede (continente, Madeira, Açores): a
# base do filtro "férias escolares" do explorador e das páginas /ferias-escolares/ (DECISIONS
# D61, #49). Lido por src/escapadinha/school_holidays.py; datas e fontes em
# docs/research/2026-11-05-ferias-escolares.md.
#
# `reviewed`: true só depois de cada data ser confirmada no texto oficial (como as dicas e os
# roteiros, D33). Com false o site não constrói nenhuma página nem oferece o filtro: a exportação
# escreve `breaks: []`. Revisto a 2026-11-05 por instrução do Miguel ("faz tu por mim"): as doze
# datas lidas nos três textos primários (DR consolidado, JORAM, Jornal Oficial dos Açores) e
# reconfirmadas por três verificadores independentes sobre o texto extraído de cada diploma
# (docs/research/2026-11-05-ferias-escolares.md). Uma data nova só entra com a mesma verificação.
#
# Cada rede: `key`, `name`, `source` (ligação oficial, https), `source_name` (como a citar) e as
# interrupções (`breaks`), cada uma com `slug` (+ rede = o endereço, /ferias-escolares/<slug>-<rede>/<origem>/),
# `name`, `start` e `end` (primeiro e último dia sem aulas, inclusive). A janela de viagem é
# start − 1 dia a end + 1 dia (sai-se na véspera, volta-se no dia seguinte).
#
# Verão: do dia seguinte ao fim das aulas do 1.º ciclo (a data mais tardia entre os ciclos do
# ensino básico: 30 de junho no continente, anexo I, e na Madeira, anexo I; 18 a 25 de junho nos
# Açores, anexo III, logo 26 de junho) até à véspera do arranque do ano letivo seguinte. A
# educação pré-escolar fica de fora: na Madeira segue um regime de 11 meses (ponto 7.1, até 14 de
# julho) e no continente e nos Açores acaba com o 1.º ciclo. Arranque de 2027/2028: continente
# entre 13 e 15 de setembro de 2027 (anexo I do Despacho n.º 8368/2024), Açores entre 13 e 15 de
# setembro de 2027 (ponto 3.2 da Portaria n.º 937/2025); Madeira só publica o calendário de
# 2027/2028 em maio de 2027, por isso o fim do verão segue o padrão de 2026/2027 (o 1.º ciclo
# começou a 10 de setembro de 2026, anexo I) e deve ser corrigido quando o despacho sair.

