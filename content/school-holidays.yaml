# Férias escolares de Portugal, ano letivo 2026/2027, por rede (continente, Madeira, Açores): a
# base do filtro "férias escolares" do explorador e das páginas /ferias-escolares/ (DECISIONS
# D61, #49). Lido por src/escapadinha/school_holidays.py; datas e fontes em
# docs/research/2026-11-05-ferias-escolares.md.
#
# `reviewed`: só uma pessoa o põe a true, depois de confirmar cada data no texto oficial (como as
# dicas e os roteiros, D33). Com false o site não constrói nenhuma página nem oferece o filtro: a
# exportação escreve `breaks: []`.
#
# Cada rede: `key`, `name`, `source` (ligação oficial, https), `source_name` (como a citar) e as
# interrupções (`breaks`), cada uma com `slug` (+ rede = o endereço, /ferias-escolares/<slug>-<rede>/<origem>/),
# `name`, `start` e `end` (primeiro e último dia sem aulas, inclusive). A janela de viagem é
# start − 1 dia a end + 1 dia (sai-se na véspera, volta-se no dia seguinte).
#
# Verão: do dia seguinte ao fim das aulas da educação pré-escolar e do 1.º ciclo (30 de junho, a
# data mais tardia) até à véspera do arranque do ano letivo seguinte. Continente: 13 a 15 de
# setembro de 2027 (anexo I do Despacho n.º 8368/2024); Açores: 13 a 15 de setembro de 2027
# (ponto 3.2 da Portaria n.º 937/2025); Madeira: o calendário de 2027/2028 só é publicado em
# maio de 2027, por isso o fim do verão segue o padrão de 2026/2027 (início a 10 de setembro) e
# deve ser corrigido quando o despacho sair.

