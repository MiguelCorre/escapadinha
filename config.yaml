# Escapadinha configuration. Secrets live in .env, never here.

brand:
  name: "Ponto Nómada"          # final name (D16, 2026-10-13); logo/tagline sketch by Miguel's partner
  tagline: "A Nocas pelo mundo, o mundo ao teu alcance."
  handle: "@ondestaanocas"    # current Instagram handle; after the rename (docs/runbooks/brand-switch.md)
                              # set "@pontonomada" together with affiliate.projects.instagram

collector:
  source: travelpayouts
  currency: eur
  months_ahead: 3            # number of departure months fetched, starting with the current month
  limit_per_request: 100      # max offers returned per route/month call
  market: pt                  # prices found on the Portuguese Aviasales market
  booking_base: https://www.aviasales.pt   # links open in euros, 24h clock (UI text is English)
  requests_per_minute: 550    # client-side cap (API limit 600/min); a run is ~routes x months_ahead calls
  workers: 8                  # concurrent requests, under the same per-minute cap (~2 min per run)

# Two tiers (DECISIONS D24), both against the route's typical LOW for that departure month:
# the median of daily lowest prices (day = when travellers found the price).
#  - low price: a fresh price >= low_threshold below it; shown on route pages automatically.
#  - promotion candidate: >= threshold AND >= min_saving_eur below it; becomes a deal for review.
detector:
  threshold: 0.30            # candidate when price <= typical_low * (1 - threshold) ...
  min_saving_eur: 15         # ... and typical_low - price >= this many euros
  low_threshold: 0.15        # low price when price <= typical_low * (1 - low_threshold)
  lookback_days: 90          # days of daily lows used for the typical low
  min_baseline_days: 4       # need this many days with a low before trusting it
  dedupe_days: 7             # do not re-flag the same trip (same dates) unless cheaper
  max_deals_per_route: 1     # per collection run, cheapest qualifying offers first
  max_offer_age_days: 3      # candidates: prices found in the last N days; older days = baseline

# Routes live in the database (`escapadinha routes list`). Config only shapes them.
routes:
  # Default rules per kind. Offers outside a route's rules are neither collected (nights)
  # nor deals nor part of its typical low. direct_only = nonstop both ways (avoids e.g.
  # Paris-Beauvais -> Milan-MXP, change airport -> BGY -> Lisbon); max_transfers = per direction.
  kinds:
    europe:    { direct_only: true,  min_nights: 2, max_nights: 10, max_transfers: 0 }
    domestic:  { direct_only: true,  min_nights: 2, max_nights: 10, max_transfers: 0 }   # "Portugal": islands, inter-island and mainland
    long_haul: { direct_only: false, min_nights: 7, max_nights: 21, max_transfers: 1 }
  # Per-route exceptions, e.g. "LIS-LON": { max_nights: 7 }. price_cap_eur (optional) is an
  # absolute ceiling used ONLY while the route's history is insufficient.
  overrides: {}
  # Route keys ("LIS-LON") or destinations ("LON") never discovered nor collected. The static
  # route catalogue is old: it still lists Lisbon-Moscow and Lisbon-Kyiv, closed since 2022.
  exclusions: [MOW, LED, IEV, MSQ]
  # Discovery (`escapadinha routes discover`, and monthly inside `run`): every direct route
  # from these airports, kind from the destination country (Portugal = domestic, Europe and
  # North Africa = europe; anything else only through the long_haul list below).
  origins: [LIS, OPO, FAO, FNC, PDL, TER]
  discover_every_days: 30
  dormant_after_days: 30     # no price seen for this long -> dormant (not collected)
  # Portuguese names that beat the catalogue's (key = destination city code). The catalogue
  # mixes in airport names (Luqa, Lajes), Brazilian spellings (Colônia) and errors (Hamburg =
  # "Finkenwerder", Algiers = "Argélia"). Applied to stored routes on every command.
  city_names:
    ACE: Lanzarote
    ALG: Argel
    BVE: Brive
    CGN: Colónia
    DLE: Dole
    EAP: Basileia-Mulhouse
    EBU: Saint-Étienne
    FKB: Karlsruhe/Baden-Baden
    FRA: Frankfurt
    HAM: Hamburgo
    MLA: Malta
    RAK: Marraquexe
    RMO: Chisinau
    RTM: Roterdão
    TER: Terceira
    TUN: Tunes
  # Curated long-haul destinations (DECISIONS D23): added for each listed origin (default
  # LIS and OPO) with the long_haul rules, and kept even though most need a stop.
  long_haul:
    - { destination: NYC, city_pt: Nova Iorque }
    - { destination: BOS, city_pt: Boston }
    - { destination: MIA, city_pt: Miami }
    - { destination: WAS, city_pt: Washington }
    - { destination: YTO, city_pt: Toronto }
    - { destination: YMQ, city_pt: Montreal }
    - { destination: RIO, city_pt: Rio de Janeiro }
    - { destination: SAO, city_pt: São Paulo }
    - { destination: SSA, city_pt: Salvador }
    - { destination: REC, city_pt: Recife }
    - { destination: FOR, city_pt: Fortaleza }
    - { destination: SID, city_pt: Ilha do Sal }
    - { destination: BVC, city_pt: Boa Vista }
    - { destination: CUN, city_pt: Cancún }
    - { destination: PUJ, city_pt: Punta Cana }
    - { destination: DXB, city_pt: Dubai }
    - { destination: MLE, city_pt: Maldivas }
    - { destination: BKK, city_pt: Banguecoque }
    - { destination: TYO, city_pt: Tóquio }
    - { destination: CPT, city_pt: Cidade do Cabo }
  # Inserted once into an empty routes table (fresh database). Destination = provider city
  # code (Travelpayouts accepts LON, PAR, ROM, MIL). Discovery adds the rest.
  seed:
    - { origin: LIS, destination: LON, city_pt: Londres }
    - { origin: LIS, destination: PAR, city_pt: Paris }
    - { origin: LIS, destination: ROM, city_pt: Roma }
    - { origin: LIS, destination: BCN, city_pt: Barcelona }
    - { origin: LIS, destination: AMS, city_pt: Amesterdão }
    - { origin: OPO, destination: LON, city_pt: Londres }
    - { origin: OPO, destination: PAR, city_pt: Paris }
    - { origin: OPO, destination: BCN, city_pt: Barcelona }
    - { origin: OPO, destination: MIL, city_pt: Milão }
    - { origin: OPO, destination: BER, city_pt: Berlim }

# Tracked links come from the Travelpayouts partner links API, one Project per channel.
# A Project's URL can't change once it joined a program: a renamed handle or a new domain
# needs a new Project. website: null -> the site uses the Instagram Project's links.
# (The older single `project_id: N` key still works and counts as the Instagram Project.)
affiliate:
  projects:
    instagram: 584711         # https://www.instagram.com/ondestaanocas/
    website: 585209           # https://pontonomada.pt (project "Pontonomada", 2026-10-13)
  shorten: true
  # Affiliate blocks in itineraries and tips (D37): programme -> the brand the block names and the
  # page the partner links API turns into a tracked link (website Project, sub_id per article).
  # Only programmes the website Project is connected to in Travelpayouts. null: not configured (the
  # block renders nothing and the site build warns). Optional `destinations: {PAR: <https page>}`
  # gives an itinerary of that city a deeper page on the brand's site.
  programmes:
    esim:                     # Yesim: 18 %, 90-day cookie, web + app tracked (2026-10-14, #18)
      brand: Yesim
      url: https://yesim.tech
    activities:               # Tiqets: museums and attractions in Europe, web + app (2026-10-14)
      brand: Tiqets
      url: https://tiqets.com
    insurance: null           # none usable: EKTA closed (2026-10-14); waiting for one for PT residents

# Public website (static, rebuilt every run, deployed to Cloudflare Pages when it changed).
# Domain switch: docs/runbooks/brand-switch.md (DECISIONS D19).
site:
  base_url: https://pontonomada.pt            # connected 2026-10-13 (Pages custom domain, D19)
  domain: pontonomada.pt                      # final domain (PTisp, Cloudflare nameservers)
  legacy_hosts:                               # Bulk Redirect -> base_url; noindex once not base_url
    - ondestaanocas.pages.dev
    - www.pontonomada.pt
  redirects: {}                               # extra "/old/path/": "/new/path/" (301), if ever needed
  cloudflare_project: ondestaanocas           # Pages project names can't be renamed; stays
  wrangler_version: 4.149.0
  # Cloudflare Web Analytics (cookieless, D34): null on purpose. The zone's automatic setup already
  # measures at the edge; a beacon token too would count every visit twice.
  analytics_token: null
  # Aviasales search form on route and destination pages (D34): the script src from Travelpayouts'
  # widget constructor (docs/runbooks/search-widget.md). null: no widget.
  search_widget: "https://tpwgts.com/content?currency=eur&trs=585209&shmarker=789000&show_hotels=true&powered_by=true&locale=pt&searchUrl=www.aviasales.pt%2Fsearch&primary_override=%2332a8dd&color_button=%2332a8dd&color_icons=%2332a8dd&dark=%23262626&light=%23FFFFFF&secondary=%23FFFFFF&special=%23C4C4C4&color_focused=%2332a8dd&border_radius=0&plain=false&promo_id=7879&campaign_id=100"
  low_prices_per_route: 5                     # low prices listed per route page (biggest discounts)
  max_new_links_per_build: 300                # new low-price links per run, export + build (<= 900: API 100 req/min)
  # Website data contract v1 (DECISIONS D27, contract/site/v1): `export site-data` output and
  # the row cap per origin's low-price file (biggest discounts kept; ~160 bytes per row).
  data_dir: web/src/data                      # read by the Astro build in web/ (D35, git-ignored)
  max_low_prices_per_origin: 1500
  expired_promotions_days: 30                 # expired promotions kept on the site; older links 301 to the route (D35)

# Review decisions (DECISIONS D26): an approve event whose live price check is older than this
# is refused when a run applies it (check the price again); reject/published never expire.
review:
  approve_max_age_hours: 24

# Posting queue (DECISIONS D32): approving a promotion queues an Instagram post at the next free
# daily slot (Lisbon time, at most max_per_day a day) and a Telegram post at once; every run
# publishes the due ones right after the recheck. Publishers: instagram (Graph API, D36) and
# dry-run (logs only) for Telegram until #21.
posting:
  instagram_slots: ["09:00", "13:00", "19:00"]
  max_per_day: 3
  max_check_age_hours: 6      # not rechecked (or approved) this recently: the post waits
  max_attempts: 5             # publisher errors before a post is cancelled
  publishers:
    instagram: instagram      # due posts wait while INSTAGRAM_ACCESS_TOKEN / INSTAGRAM_ACCOUNT_ID are unset (D36)
    telegram: dry-run

# Instagram publisher (D36, docs/runbooks/instagram.md). login: instagram = Instagram API with
# Instagram Login (graph.instagram.com, no Facebook Page; the token is refreshed when fewer than
# refresh_days remain); facebook = Facebook Login (graph.facebook.com, account linked to a Page).
instagram:
  login: instagram
  api_version: v23.0
  refresh_days: 10
  images_wait_hours: 24       # JPEGs still not on the site this long after the slot: each wait counts as a failure

origins_pt:
  LIS: Lisboa
  OPO: Porto
  FAO: Faro
  FNC: Madeira
  PDL: Ponta Delgada
  TER: Terceira
# The article an origin's name takes in a sentence: "desde o Porto", "desde a Madeira";
# origins not listed take none ("desde Lisboa"). The site writes the sentences (origins.json).
origins_article:
  OPO: o
  FNC: a
  TER: a

photos:
  # Every destination of an active route gets a photo automatically (after a discovery and
  # on each run while some are missing, max_per_run at a time: up to 4 searches (travel,
  # places, buildings, any) + 1 download each, Pixabay limit 100/min). Query = the override
  # below, else the English city name (photo must be tagged with it), else city_pt.
  max_per_run: 20
  queries:
    LON: London skyline
    PAR: Paris Eiffel tower
    ROM: Rome Colosseum
    BCN: Barcelona city
    AMS: Amsterdam canals
    MIL: Milan Duomo
    BER: Berlin Brandenburg gate
    LIS: Lisbon viewpoint rooftops   # used by the sample guide
    # English names that are ambiguous or too generic on Pixabay
    NCE: Nice France
    TUF: Tours France
    NOC: Knock Ireland
    PMI: Palma de Mallorca
    SSA: Salvador Bahia
    MLE: Maldives beach
    SID: Sal Cape Verde beach
    BVC: Boa Vista Cape Verde beach
    TER: Terceira Azores
    PDL: Sao Miguel Azores
    HOR: Horta Faial Azores
    PIX: Pico Azores
    SJZ: Sao Jorge Azores
    GRW: Graciosa Azores
    FLW: Flores Azores
    CVU: Corvo Azores
    SMA: Santa Maria Azores
    FNC: Madeira Funchal
    PXO: Porto Santo beach
    # Automatic picks that were wrong on 2026-10-13 (bird, market stall, wrong city)
    CPT: Cape Town Table Mountain
    CUN: Cancun beach Mexico
    ALC: Alicante coast harbor
    ANK: Anitkabir Ankara
