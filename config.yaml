# Escapadinha configuration. Secrets live in .env, never here.

brand:
  name: Escapadinha
  handle: "@ondestaanocas"    # real Instagram account (name may change later)

collector:
  source: travelpayouts
  currency: eur
  months_ahead: 3            # number of departure months fetched, starting with the current month
  min_nights: 2
  max_nights: 10
  limit_per_request: 100      # max offers returned per route/month call

# A deal = a fresh price well below the route's typical LOW for that departure month:
# the median of daily lowest prices (day = when travellers found the price).
detector:
  threshold: 0.30            # deal when price <= typical_low * (1 - threshold)
  lookback_days: 90          # days of daily lows used for the typical low
  min_baseline_days: 4       # need this many days with a low before trusting it
  dedupe_days: 7             # do not re-flag the same trip (same dates) unless cheaper
  max_deals_per_route: 1     # per collection run, cheapest qualifying offers first
  max_offer_age_days: 3      # candidates: prices found in the last N days; older days = baseline

# City or airport IATA codes. Travelpayouts accepts city codes (LON, PAR, ROM, MIL).
# price_cap_eur (optional): absolute ceiling used ONLY while history is insufficient.
routes:
  - { origin: LIS, destination: LON, city_pt: Londres }
  - { origin: LIS, destination: PAR, city_pt: Paris }
  - { origin: LIS, destination: ROM, city_pt: Roma }
  - { origin: LIS, destination: BCN, city_pt: Barcelona }
  - { origin: LIS, destination: AMS, city_pt: Amesterdão }
  - { origin: OPO, destination: LON, city_pt: Londres }
  - { origin: OPO, destination: PAR, city_pt: Paris }
  - { origin: OPO, destination: BCN, city_pt: Barcelona }
  - { origin: OPO, destination: MIL, city_pt: Milão }
  - { origin: OPO, destination: BER, city_pt: Berlim }

# Tracked links come from the Travelpayouts partner links API for this Project
# (Instagram https://www.instagram.com/ondestaanocas/). A renamed handle needs a new Project.
affiliate:
  project_id: 584711
  shorten: true

origins_pt:
  LIS: Lisboa
  OPO: Porto
  FAO: Faro

photos:
  # Search query per destination for the Pixabay API. Falls back to city_pt.
  queries:
    LON: London skyline
    PAR: Paris Eiffel tower
    ROM: Rome Colosseum
    BCN: Barcelona city
    AMS: Amsterdam canals
    MIL: Milan Duomo
    BER: Berlin Brandenburg gate
    LIS: Lisbon viewpoint rooftops   # used by the sample guide
